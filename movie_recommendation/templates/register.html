{% extends "base.html" %}

{% block content %}
  <section class="auth-panel">
    <h1>Register</h1>
    <form class="auth-form" method="post">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" minlength="3" required />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="new-password" minlength="6" required />
      </label>
      <label>
        Confirm password
        <input type="password" name="confirm_password" autocomplete="new-password" minlength="6" required />
      </label>
      <button type="submit">Register</button>
    </form>
    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('frontend.login') }}">Login</a>.
    </p>
  </section>
{% endblock %}
